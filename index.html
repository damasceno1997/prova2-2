<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f5">
    <title>Calculadora de compra</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="calculator-card" aria-labelledby="page-title">
            <div class="card-heading">
                <h1 id="page-title">Calculadora de compra</h1>
            </div>

            <form id="form-compra" class="calculator-form">
                <div class="field-group">
                    <label for="preco">Preço do produto</label>
                    <div class="input-wrap">
                        <span class="input-prefix" aria-hidden="true">R$</span>
                        <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="0,00">
                    </div>
                </div>

                <div class="field-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade" min="1" step="1" placeholder="Ex.: 2">
                </div>

                <div class="field-group">
                    <label for="desconto">Desconto</label>
                    <div class="input-wrap">
                        <input type="number" id="desconto" name="desconto" min="0" max="100" step="0.01" placeholder="Ex.: 10">
                        <span class="input-suffix" aria-hidden="true">%</span>
                    </div>
                </div>

                <button type="submit" id="bt-calcular">Calcular</button>
            </form>

            <section class="result-card" aria-live="polite" aria-atomic="true">
                <div class="result-label">Valor final</div>
                <p class="resultado" id="resultado">R$ 0,00</p>
            </section>

        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
